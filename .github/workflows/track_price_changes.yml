name: Track FPL Price Changes & Snapshots

on:
  schedule:
    # Runs at 01:45 UTC daily (15 mins after the official 01:30 UTC FPL price change window)
    - cron: '45 1 * * *'
    # Runs every 4 hours to log real-time transfer velocity (%/hr)
    - cron: '45 5,9,13,17,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/track_price_changes.yml'

jobs:
  track-price-snapshots:
    name: Sync Live FPL Telemetry to Redis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Price Tracking, Odds, Momentum & EO Engine
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || secrets.KV_REST_API_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || secrets.KV_REST_API_TOKEN }}
        run: |
          node scripts/track_fpl_prices.js
          node scripts/sync_betting_odds.js
          node scripts/sync_form_momentum.js
          node scripts/sync_top10k_eo.js
          echo "✅ All live FPL datasets successfully scraped and synced to Upstash Redis!"
