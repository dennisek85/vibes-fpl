name: Track FPL Price Changes & Snapshots

on:
  schedule:
    # Runs at 01:45 UTC daily (15 mins after the official 01:30 UTC FPL price change window)
    - cron: '45 1 * * *'
    # Runs every 4 hours to log real-time transfer velocity (%/hr)
    - cron: '45 5,9,13,17,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'scripts/track_fpl_prices.js'
      - '.github/workflows/track_price_changes.yml'

permissions:
  contents: write

jobs:
  track-price-snapshots:
    name: Record Price Baselines & Velocity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Price Tracking & Snapshot Engine
        run: |
          node scripts/track_fpl_prices.js

      - name: Commit & Push Updated Snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/price_snapshots.json
          if git diff --staged --quiet; then
            echo "No price delta changes to commit."
          else
            git commit -m "📊 [FPL Price Tracker] Auto-update transfer baselines & velocity"
            git push origin main
          fi
